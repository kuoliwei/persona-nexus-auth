<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona Nexus - 召喚終端機</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <div class="auth-container">
    <h2>PERSONA NEXUS</h2>
    <p class="subtitle">AI 角色連結中樞 · 使用者註冊</p>
    <div class="tab-switcher">
      <button type="button" id="tabRegister" class="active">註冊</button>
      <button type="button" id="tabLogin">登入</button>
    </div>
    <form id="registerForm">
      <div class="input-group">
        <label for="email">電子郵件 (Email)</label>
        <input type="email" id="email" placeholder="enter your email..." required>
      </div>

      <div class="input-group">
        <label for="password">安全密碼 (Password)</label>
        <input type="password" id="password" placeholder="enter your password..." required>
      </div>

      <button type="submit" id="submitBtn">註冊</button>
    </form>
    <form id="loginForm">
      <div class="input-group">
        <label for="loginEmail">電子郵件 (Email)</label>
        <input type="email" id="loginEmail" placeholder="enter your email..." required>
      </div>

      <div class="input-group">
        <label for="loginPassword">安全密碼 (Password)</label>
        <input type="password" id="loginPassword" placeholder="enter your password..." required>
      </div>

      <button type="submit" id="loginBtn">登入</button>
    </form>
    <div id="messageBox" class="message-box"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
